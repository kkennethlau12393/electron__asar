# diff coverage off: needs @vitest/coverage-v8 pinned to your vitest version.
# `abloh prepare` stages it, or add it as an exact devDependency.

# abloh.yml - read from the PR merge base, so changes are reviewed like code.
# Keys: https://abloh.dev/docs#policy

# % of mechanical breaks in changed lines your tests must catch.
threshold: 70

# true: below threshold fails the check. Blocks merges only if also marked
# required in branch protection.
enforce: true

# Rebuild recipe for the proof container. Comments name the source file.
environment:
  runtimeImage: "node:22.23.1-bookworm-slim@sha256:6c74791e557ce11fc957704f6d4fe134a7bc8d6f5ca4403205b2966bd488f6b3"  # reviewed Node 22 image (.nvmrc, node >=22.12.0 in package.json)
  installDirectory: "."
  setup: ".abloh/setup.sh"           # written by init and yours to edit. Every cold run executes it step by step
  testCommand: "corepack yarn test"  # scripts.test in package.json
  sealedTestCommand: "npx --no-install vitest run --reporter=json"  # runs vitest alone; scripts.test is gated by yarn, yarn and xvfb-maybe
  identityFiles:   # a change here triggers reinstall instead of container reuse
    - ".yarnrc.yml"
